[addressbooks]
[[contacts]]
path = ~/.local/share/contacts/contacts/

[general]
default_action = list
editor = nvim, -i, NONE
merge_editor = vimdiff

[contact table]
display = first_name
show_uids = no
show_kinds = no
sort = first_name
localize_dates = yes

[vcard]
preferred_version = 3.0
search_in_source_files = yes
skip_unparsable = yes
