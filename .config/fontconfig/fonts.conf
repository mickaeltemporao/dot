<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

  <!-- Input Mono -->
  <alias>
    <family>Input Mono</family>
    <prefer>
      <family>Input Mono</family>
      <family>Symbols Nerd Font</family>
      <family>JetBrainsMono Nerd Font Mono</family>
    </prefer>
  </alias>

  <!-- Monospace (Coding & Terminal) -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Input Mono</family>
      <family>Symbols Nerd Font</family>
      <family>JetBrainsMono Nerd Font Mono</family>
    </prefer>
  </alias>

  <!-- Input Nerd Font Alias -->
  <alias>
    <family>Input Nerd Font</family>
    <prefer>
      <family>Input Mono</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

  <!-- Sans-Serif (dwm bar, dunst, UI) -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Input Sans</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Serif (Prose, reading) -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Input Serif</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Prevent color emoji font from hijacking Private Use Area Nerd Font symbols in st / terminal -->
  <match target="pattern">
    <test name="prgname" compare="contains"><string>st</string></test>
    <edit name="color" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="color" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Input Mono</string></test>
    <edit name="color" mode="assign"><bool>false</bool></edit>
  </match>

</fontconfig>
