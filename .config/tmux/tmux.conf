unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g default-terminal "tmux-256color"
set -g default-command "${SHELL}"
set -sa terminal-features ",st-256color:RGB,xterm-256color:RGB"
set -sa terminal-overrides ",st-256color:Tc,xterm-256color:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q' # Cursor shape passthrough for nvim
set -sg escape-time 10                                 # Eliminate Esc key delay in nvim
set -g focus-events on                                 # Pass focus events to nvim
set -g history-limit 20000                             # Scrollback buffer size
set -g mouse on                                        # Enable mouse scroll & window selection
set -g base-index 1                                    # Start window numbering at 1
setw -g pane-base-index 1                              # Start pane numbering at 1

# NY Taxi (Medallion Dark) Statusline
set -g status-position bottom
set -g status-style "bg=#101214,fg=#e6e8eb"
set -g status-left "#[fg=#f5b700,bold][#S] "
set -g status-right "#[fg=#6e7681]%R "
set -g window-status-current-format "#[fg=#101214,bg=#f5b700,bold] #I #W #[default]"
set -g window-status-format "#[fg=#6e7681,bg=#101214] #I #W "
set -g pane-border-style "fg=#23272e"
set -g pane-active-border-style "fg=#f5b700"

unbind %
bind v split-window -h

unbind '"'
bind h split-window -v

set-window-option -g mode-keys vi
set -s set-clipboard on

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Direct system clipboard pipe (Linux & macOS)
if-shell 'command -v xclip >/dev/null 2>&1' \
    "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"
if-shell 'command -v pbcopy >/dev/null 2>&1' \
    "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'"

unbind -T copy-mode-vi MouseDragEnd1Pane

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

unbind r
bind r source-file ~/.config/tmux/tmux.conf


