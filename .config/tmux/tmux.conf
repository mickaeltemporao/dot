unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g default-terminal "tmux-256color"
set -g default-command "${SHELL}"
set -sa terminal-features ",st-256color:RGB,xterm-256color:RGB"
set -sa terminal-overrides ",st-256color:Tc,xterm-256color:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q' # Cursor shape passthrough for nvim
set -sg escape-time 10                                 # Eliminate Esc key delay in nvim
set -g focus-events on                                 # Pass focus events to nvim
set -g history-limit 20000                             # Scrollback buffer size
set -g mouse on                                        # Enable mouse scroll & window selection
set -g base-index 1                                    # Start window numbering at 1
setw -g pane-base-index 1                              # Start pane numbering at 1
set -g allow-rename off                                # Prevent programs/shells from changing window names via escape codes
set -g automatic-rename off                            # Stop tmux from automatically renaming windows based on active command

# NY Taxi (Medallion Dark) Statusline
set -g status-position top
set -g status-style "bg=#101214,fg=#e6e8eb"
set -g status-left "#[fg=#6e7681][#S] "
set -g status-interval 2
set -g status-right-length 150
set -g status-right "#(~/.config/tmux/status.sh)#[fg=#484f58]| #[fg=#6e7681] %I:%M %p "
set -g window-status-current-format "#[fg=#101214,bg=#f5b700,bold] #I #W #[default]"
set -g window-status-format "#[fg=#6e7681,bg=#101214] #I #W "
set -g pane-border-style "fg=#23272e"
set -g pane-active-border-style "fg=#f5b700"

# Center Notifications: keep tabs on left, metrics on right, notification in the middle
set -g 'status-format[0]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=centre]#{?@notification,#[fg=#f5b700]  #{@notification}#[default],}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

unbind %
bind v split-window -h -c "#{pane_current_path}"

unbind '"'
bind h split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

set-window-option -g mode-keys vi
set -s set-clipboard on

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Direct system clipboard pipe (Linux & macOS)
if-shell 'command -v xclip >/dev/null 2>&1' \
    "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"
if-shell 'command -v pbcopy >/dev/null 2>&1' \
    "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'"

unbind -T copy-mode-vi MouseDragEnd1Pane

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf|neomutt)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

unbind r
bind r source-file ~/.config/tmux/tmux.conf


